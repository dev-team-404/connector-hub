# ConnectorHub 백엔드 — 단일 Python 프로젝트에 다중 진입점(api · worker). 둘이 도메인
# 코드(`core`)를 공유하므로 프로젝트를 나누지 않는다. 배포 이미지는 진입점마다 나눈다.
# AgentToolbox `apps/server` 와 같은 구조다.
# AgentToolbox `apps/server` 의 도구 선택(uv · ruff · pytest)을 그대로 따른다 — 같은 사람이
# 양쪽을 오가므로 설정이 다르면 그 차이 자체가 실수의 원인이 된다.

[project]
name = "connector-hub-backend"
version = "0.0.0"
description = "ConnectorHub API — 사내 MCP 서버 카탈로그"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # 사이트 세션 JWT 검증 — 비대칭 서명(EdDSA/RS256)이라 crypto extra 가 필요하다.
  "pyjwt[crypto]>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "mcp>=2.0",
  # 마이그레이션의 sync 경로. **런타임 의존성이다** — 배포 이미지 안에서 `alembic upgrade`
  # 가 돌기 때문이다. dev extra 에 두면 `--no-dev` 로 빌드한 이미지의 migrate 잡이
  # ModuleNotFoundError 로 죽고, 그 실패는 배포 때가 되어서야 드러난다.
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
connector-hub-api = "api.main:run"
connector-hub-worker = "worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/worker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "worker"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
