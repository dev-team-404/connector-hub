name: connector-hub

# ConnectorHub 스택 — postgres · migrate · api · worker.
#
# **게이트웨이는 여기 없다.** `/connector/*` 경로 계약은 AgentToolbox 쪽 nginx 가 소유한다
# (설계 §6). 이 파일은 그 nginx 가 붙을 upstream 만 노출한다. 그래서 정상적인 ConnectorHub
# 릴리스가 게이트웨이나 AgentToolbox 재배포를 요구하지 않는다(설계 §13).
#
# **web 서비스는 아직 없다.** frontend 소스가 들어오면(connector-hub#5) 여기에 붙는다.

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# api·worker·migrate 가 **같은 이미지**를 쓴다. 이유는 backend/Dockerfile 첫 주석에 있다.
x-backend: &backend
  image: connector-hub-backend:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    # 사내 빌드는 apt·pypi 를 프록시로 돌린다. 미주입이면 빈 문자열이라 사외에서도 그대로 된다.
    args:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,postgres,api,worker}
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,postgres,api,worker}}
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-connector_hub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-connector_hub}}
    # --- 사이트 인증. **환경마다 한 벌씩 간다**(docs/deployment.md 의 짝짓기 제약) ---
    SITE_AUTH_BASE_URL: ${SITE_AUTH_BASE_URL:?set SITE_AUTH_BASE_URL}
    SITE_AUTH_ISSUER: ${SITE_AUTH_ISSUER:?set SITE_AUTH_ISSUER}
    SITE_AUTH_SERVICE_TOKEN: ${SITE_AUTH_SERVICE_TOKEN:?set SITE_AUTH_SERVICE_TOKEN}
    SITE_AUTH_AUDIENCE: ${SITE_AUTH_AUDIENCE:-agent-factory-site}
    # --- 커넥터 아웃바운드 ---
    CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
    CONNECTOR_OUTBOUND_CONCURRENCY: ${CONNECTOR_OUTBOUND_CONCURRENCY:-8}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  logging: *logging
  networks: [connector-net]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connector_hub}
      POSTGRES_USER: ${POSTGRES_USER:-connector_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - connector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging
    networks: [connector-net]

  # 스키마를 먼저 올린다. **이 잡이 성공해야 api·worker 가 시작한다** — 아래 두
  # 서비스의 `service_completed_successfully` 게이트가 그것이다(설계 §13). 실패하면
  # 새 컨테이너가 아예 뜨지 않으므로, 스키마와 코드가 어긋난 채 트래픽을 받는 상태가
  # 생기지 않는다.
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "-c", "/app/migrations/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    command: ["connector-hub-api"]
    # 게이트웨이가 `/connector/api/v1/*` 를 여기로 보낸다. **접두사는 게이트웨이가 떼고
    # 보낸다** — 앱은 `root_path` 로 그 접두사를 알고 있을 뿐, 요청 경로에는 없다.
    # 그래서 컨테이너 안 헬스체크는 `/health` 다.
    ports:
      - "${API_PORT:-8100}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 별도 프로세스로 띄운다. 주기 프로브가 폭주해도 API 요청이 영향을 받지 않아야 한다
  # (설계 §9.3). **복제본을 늘려도 스윕은 하나만 돈다** — advisory lock 이 막는다.
  worker:
    <<: *backend
    restart: unless-stopped
    command: ["connector-hub-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  connector_pgdata:

networks:
  connector-net:
    driver: bridge
