name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connector_hub
          POSTGRES_PASSWORD: connector_hub
          POSTGRES_DB: connector_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # 스키마 테스트는 CHECK 가 실제로 막는지 DB 에 직접 물어봐야 확인된다. 게이트에서
      # 빼 두면 조용히 빠진 제약을 이관 리허설에서야 발견하게 된다.
      DATABASE_URL: postgresql://connector_hub:connector_hub@localhost:5432/connector_hub_test
      CONNECTOR_TEST_DATABASE_URL: postgresql://connector_hub:connector_hub@localhost:5432/connector_hub_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ruff check ../../migrations
          uv run ruff format --check ../../migrations
      - name: typecheck
        run: uv run mypy src
      - name: migrate
        run: uv run alembic -c ../../migrations/alembic.ini upgrade head
      - name: 마이그레이션 되돌리기 왕복
        run: |
          uv run alembic -c ../../migrations/alembic.ini downgrade base
          uv run alembic -c ../../migrations/alembic.ini upgrade head
      - name: head 가 하나인지
        run: |
          heads=$(uv run alembic -c ../../migrations/alembic.ini heads | grep -c '(head)')
          test "$heads" -eq 1 || { echo "alembic head 가 $heads 개다"; exit 1; }
      - name: test
        run: uv run pytest -q

  contract-drift:
    # 계약 벡터는 AgentToolbox 가 정본이다. 사본이 낡으면 "우리 구현에 맞춘 벡터" 가 되어
    # 계약으로서의 의미가 사라지므로, 갈라졌는지 여기서 알린다.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 정본과 대조
        run: |
          curl -fsSL -o /tmp/upstream.json \
            https://raw.githubusercontent.com/dev-team-404/AgentToolbox/main/apps/server/tests/fixtures/site_jwt/vectors.json
          if diff -q /tmp/upstream.json apps/api/tests/fixtures/site_jwt/vectors.json; then
            echo "계약 벡터 일치"
          else
            echo "::warning::계약 벡터가 AgentToolbox 정본과 다르다. 정본을 먼저 확인하고 사본을 갱신할 것."
            diff /tmp/upstream.json apps/api/tests/fixtures/site_jwt/vectors.json || true
          fi
